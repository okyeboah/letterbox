<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>letterbox</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>letterbox</h1>
    <nav>
      <button class="tab active" data-tab="email">Email</button>
      <button class="tab" data-tab="sms">SMS</button>
    </nav>
    <div class="controls">
      <input id="search" type="search" placeholder="Search" autocomplete="off">
      <label class="toggle"><input id="auto" type="checkbox" checked> Auto</label>
      <button id="refresh">Refresh</button>
      <button id="clear" class="danger">Clear all</button>
    </div>
  </header>
  <main>
    <section id="list"></section>
    <section id="detail"><p class="empty">Select a message to see it.</p></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
